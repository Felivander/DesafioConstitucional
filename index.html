<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Un juego de preguntas sobre la Constitución Argentina para dos equipos."><title>Desafío Constitucional</title><style>:root{color-scheme:dark;--gold:#f6d38c;--purple:#b68aff;--cyan:#54deed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 7% 40%,#33225170,transparent 45%),radial-gradient(ellipse at 95% 40%,#124b6470,transparent 45%),#080f20;color:#f2f5ff;font-family:system-ui,sans-serif;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:48px 48px}header,main,footer{position:relative;max-width:1180px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:26px 28px}.brand{color:var(--gold);display:flex;align-items:center;gap:12px;text-decoration:none;font-size:30px}.brand span{font-size:12px;letter-spacing:3px;font-weight:800}nav{display:flex;gap:10px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ffffff25;background:#ffffff07;border-radius:12px;padding:12px 18px;color:inherit;transition:.16s}button:hover:not(:disabled){background:#ffffff14;transform:translateY(-2px);border-color:#ffffff70}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{cursor:default;opacity:.4}main{padding:20px 28px 40px;min-height:76vh}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(42px,6vw,72px);line-height:1.08;margin:18px 0}h1 em{font-style:normal;color:var(--gold)}.lead{color:#aebbd2;font-size:18px;line-height:1.7;max-width:650px}.setup{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;padding-top:32px}.panel{background:linear-gradient(140deg,#18213a,#10182b);border:1px solid #ffffff20;border-radius:24px;padding:28px;box-shadow:0 25px 70px #0003}.formteams{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;color:#aebbd2;margin-bottom:20px}input,select{display:block;width:100%;padding:14px;background:#080f20;border:1px solid #ffffff25;color:white;border-radius:10px;margin-top:9px}input{max-width:100%}.primary{background:var(--gold);color:#131b2c;font-weight:800;border:0}.primary:hover:not(:disabled){background:#ffe6b6}.wide{width:100%}.rules{color:#c0cadc;line-height:1.8;padding-left:20px;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.chip{font-size:12px;border:1px solid #ffffff20;border-radius:99px;padding:8px 12px;color:#bdc9df}.scores{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:18px}.team{padding:20px 26px;border:1px solid #8054b9;border-radius:18px;background:linear-gradient(120deg,#45236055,#111a30);display:flex;align-items:center;gap:20px;opacity:.65}.team.t1{border-color:#3c8caa;background:linear-gradient(120deg,#111a30,#0d586455)}.team.active{opacity:1;box-shadow:0 0 30px #ac69ff18;border-width:2px}.team.t1.active{box-shadow:0 0 30px #54deed18}.emblem{font-size:36px}.teamname{color:var(--purple);font-size:14px;font-weight:800;overflow-wrap:anywhere}.t1 .teamname{color:var(--cyan)}.points{font-size:42px;color:var(--gold);font-weight:750;line-height:1.2}.points small{font-size:13px;color:#aebbd2;font-weight:400}.vs{text-align:center;color:var(--gold);font-family:Georgia;font-size:24px}.meta{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px;gap:12px}.progress{height:5px;background:#ffffff12;border-radius:20px;margin:16px 0 28px;overflow:hidden}.progress div{background:linear-gradient(90deg,var(--purple),var(--cyan));height:100%}.clock{border:2px solid var(--gold);border-radius:100%;width:66px;height:66px;display:grid;place-items:center;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}.clock.urgent{border-color:#ff7e88;color:#ff7e88}.question{text-align:center;padding:24px 20px 32px}.question h2{font-family:Georgia,serif;font-size:clamp(24px,3.1vw,38px);line-height:1.35;margin:12px auto 0;max-width:930px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.answer{display:flex;gap:15px;align-items:center;min-height:85px;text-align:left;background:#151f35;border-color:#364661;font-size:17px}.letter{color:var(--gold);font-family:Georgia;font-size:27px}.answer.correct{background:#164739;border-color:#53d9a1;opacity:1}.answer.wrong{background:#4e2333;border-color:#ff8394;opacity:1}.answer.eliminated{visibility:hidden}.controls{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.turn{color:var(--purple);font-weight:800}.turn.blue{color:var(--cyan)}.feedback{margin:22px 0;padding:20px 24px;border-left:3px solid var(--gold);border-radius:8px;background:#ffffff07;line-height:1.7}.feedback strong{display:block;color:var(--gold);font-size:20px}.muted{color:#aebbd2;font-size:13px;line-height:1.7}.center{text-align:center;max-width:740px;margin:50px auto}.trophy{font-size:80px}.summary{display:flex;justify-content:center;gap:30px;margin:30px 0}.summary>div{padding:20px;min-width:180px;background:#ffffff08;border-radius:18px}.summary strong{font-size:38px;color:var(--gold);display:block}.review{margin-top:35px;text-align:left}details{padding:15px;border-bottom:1px solid #ffffff20}summary{cursor:pointer}footer{padding:24px;text-align:center;font-size:11px;letter-spacing:1px;color:#8292ac}footer a{color:#aebbd2}.hidden{display:none}@media(max-width:700px){header{padding:18px}nav button{padding:9px;font-size:11px}.setup{grid-template-columns:1fr;gap:20px;padding-top:0}main{padding:12px 18px}.scores{grid-template-columns:1fr 28px 1fr;gap:6px}.team{padding:12px;gap:8px}.emblem{font-size:24px}.points{font-size:30px}.teamname{font-size:12px}.answers{grid-template-columns:1fr}.answer{min-height:68px}.formteams{grid-template-columns:1fr 1fr}h1{font-size:44px}.summary{gap:10px}.summary>div{min-width:0;flex:1}.chip{font-size:10px}.meta{margin-top:20px}.panel{padding:22px}}

function tick(){clearInterval(timer);state.deadline=Date.now()+(state.remainingMs??state.seconds*1000);delete state.remainingMs;timer=setInterval(updateClock,100)}
function updateClock(){if(!state||state.phase!=='answer')return;state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));let el=$('#clock');if(el){el.textContent=state.seconds;el.classList.toggle('urgent',state.seconds<=10)}if(state.seconds===0)miss('Se terminó el tiempo.')}
function pause(){if(state.phase!=='answer')return;updateClock();if(state.phase!=='answer')return;state.remainingMs=Math.max(0,state.deadline-Date.now());clearInterval(timer);state.phase='paused';render()}
function choose(i){if(!state||state.phase!=='answer'||state.hidden.includes(i)||!state.deck[state.i].choices[i])return;if(Date.now()>=state.deadline){miss('Se terminó el tiempo.');return}state.selected=i;render()}
function confirmAnswer(){if(state?.selected===null||state?.selected===undefined)return;answer(state.selected)}
function answer(i){if(!state||state.phase!=='answer'||state.hidden.includes(i)||state.wrong.includes(i))return;clearInterval(timer);if(Date.now()>=state.deadline){miss('Se terminó el tiempo.');return}let q=state.deck[state.i];if(!q.choices[i])return;if(q.choices[i].ok){let pts=100;state.scores[state.team]+=pts;state.message=`¡Correcto! +${pts} para ${state.names[state.team]}`;beep(true);finish()}else{state.wrong.push(i);miss('Esa no era la respuesta.')}}
function miss(msg){if(!state||state.phase!=='answer')return;clearInterval(timer);beep(false);state.message=msg+' No suma puntos. La pregunta termina aquí.';finish()}
function finish(){clearInterval(timer);state.result=state.deck[state.i].choices[state.selected]?.ok?'correct':'wrong';state.hidden=[];state.phase='done';state.log.push({q:state.deck[state.i],message:state.message});render()}
function fifty(){if(state.phase!=='answer'||!state.lifelines[state.team]||state.usedHere)return;if(Date.now()>=state.deadline){miss('Se terminó el tiempo.');return}let q=state.deck[state.i];state.selected=null;state.hidden=shuffle(q.choices.map((c,i)=>!c.ok&&!state.wrong.includes(i)?i:null).filter(i=>i!==null)).slice(0,2);state.lifelines[state.team]--;state.usedHere=true;render()}
function next(){if(!state||state.phase!=='done')return;state.phase='transition';clearInterval(timer);state.i++;if(state.i<state.deck.length){prepare();return}if(state.scores[0]===state.scores[1]){tieScreen();return}end()}
function tieScreen(){state.phase='tie';app.innerHTML=`<section class="panel center"><div class="trophy">⚖️</div><div class="eyebrow">¡Igualdad en el marcador!</div><h1>Hay <em>empate.</em></h1><p class="lead">Una pareja de preguntas extra: una oportunidad inicial para cada equipo, sin rebote y con los comodines que les queden. Si siguen empatados, pueden cerrar en empate o jugar otra pareja.</p><button class="primary" id="tie">Jugar dos preguntas extra</button> <button id="draw">Terminar en empate</button></section>`;$('#draw').onclick=end;$('#tie').onclick=()=>{let used=new Set(state.deck.map(q=>q.id)),remaining=BANK.filter(q=>!used.has(q.id));if(remaining.length<2)remaining=BANK;state.deck.push(...shuffle(remaining).slice(0,2).map(q=>({...q,choices:shuffle(q.options.map((text,i)=>({text,ok:i===0})))})));state.tie=true;prepare()}}
function end(){state.phase='ended';clearInterval(timer);let winner=state.scores[0]===state.scores[1]?-1:state.scores[0]>state.scores[1]?0:1;app.innerHTML=`<section class="center winner-screen"><div class="winner-hero"><div class="winner-mate left" role="img" aria-label="Carpincho tomando mate"></div><div class="winner-announcement"><div class="trophy">${winner<0?'🤝':'🏆'}</div><div class="eyebrow">${winner<0?'Partida empatada':'🏆 EQUIPO GANADOR 🏆'}</div><h1 class="winner-name">${winner<0?'¡Empate!':esc(state.names[winner])}</h1><p class="winner-cheer">${winner<0?'¡Los dos equipos se ganaron unos mates!':'¡CAMPEONES DEL DESAFÍO CONSTITUCIONAL!'}</p></div><div class="winner-mate right" role="img" aria-label="Carpincho tomando mate"></div></div><p class="lead" style="margin:auto">El mejor resultado: conocer un poco más nuestros derechos y cómo se organiza el país.</p><div class="summary">${state.names.map((n,t)=>`<div>${esc(n)}<strong>${state.scores[t]}</strong>puntos</div>`).join('')}</div><button class="primary" id="again">Nueva partida ↻</button><div class="review"><h2>Repaso de la partida</h2>${state.log.map(({q,message})=>`<details><summary>${esc(q.q)}</summary><p>${esc(q.explanation)}</p><p class="muted">${esc(message)}</p></details>`).join('')}</div></section>`;$('#again').onclick=home}
document.addEventListener('keydown',e=>{if(!state||e.repeat||['ended','tie','transition'].includes(state.phase)||e.ctrlKey||e.altKey||e.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;let k=e.key.toLowerCase();if('abcd'.includes(k)&&k.length===1){e.preventDefault();choose('abcd'.indexOf(k))}if(e.key==='Enter'&&state.phase==='answer'&&!['pause','fifty'].includes(document.activeElement?.id)){e.preventDefault();confirmAnswer()}if(e.code==='Space'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();if(state.phase==='ready')start();else if(state.phase==='done'&&$('#next'))next()}});

function persist(){try{if(state){localStorage.setItem(SAVE_KEY,JSON.stringify({version:4,state,sound,savedAt:Date.now()}))}}catch{}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch{}}
function loadSave(){try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY));if(saved?.version!==4)return null;const s=saved.state;if(!s||!Array.isArray(s.deck)||!s.deck.length||!Array.isArray(s.names)||s.names.length!==2||!Array.isArray(s.scores)||!s.scores.every(Number.isFinite)||!Number.isInteger(s.i)||s.i<0||s.i>s.deck.length||!['ready','answer','paused','done','tie','ended'].includes(s.phase))return null;if(!s.deck.every(q=>typeof q.q==='string'&&typeof q.explanation==='string'&&Array.isArray(q.choices)&&q.choices.length===4&&q.choices.filter(c=>c.ok).length===1))return null;return saved}catch{return null}}
const originalRender=render;
render=function(){originalRender();if(state.phase==='answer'||state.phase==='paused'){
 document.querySelectorAll('[data-answer]').forEach(b=>{const i=+b.dataset.answer;b.classList.toggle('selected',i===state.selected);b.setAttribute('aria-pressed',String(i===state.selected))});
 const bar=document.createElement('div');bar.className='confirmbar';bar.innerHTML=`<span>${state.selected===null?'Elegí una opción. Todavía no respondiste.':'Elegiste '+ 'ABCD'[state.selected]+'. Podés cambiarla antes de confirmar.'}</span><button class="primary" id="confirm" ${state.phase!=='answer'||state.selected===null?'disabled':''}>Confirmar respuesta ✓</button>`;$('.answers').after(bar);$('#confirm').onclick=confirmAnswer;
}persist()};
const originalHome=home;
home=function(){originalHome();const saved=loadSave();if(saved){const box=document.createElement('div');box.className='resume panel';box.innerHTML='<strong>Tenés una partida guardada</strong><p>Recuperá los puntos y comodines donde los dejaste.</p><button class="primary" id="recover">Continuar partida</button> <button id="discard">Descartar guardado</button>';app.prepend(box);$('#recover').onclick=restore;$('#discard').onclick=()=>{clearSave();home()}}const a=document.createElement('a');a.className='offline-download';a.href='#';a.download='Desafio_Constitucional_sin_internet.html';a.textContent='↓ Descargar para jugar sin internet';$('.setup').append(a);const submit=$('#setup').onsubmit;$('#setup').onsubmit=e=>{clearSave();submit(e)}};
function restore(){const saved=loadSave();if(!saved)return home();state=saved.state;sound=saved.sound;$('#sound').textContent='Sonido: '+(sound?'sí':'no');if(state.phase==='answer'){state.remainingMs=Math.max(0,state.deadline-Date.now());state.seconds=Math.ceil(state.remainingMs/1000);if(state.remainingMs===0){miss('Se terminó el tiempo mientras la partida estaba cerrada.');return}state.phase='paused';state.message=''}if(state.phase==='tie')tieScreen();else if(state.phase==='ended')end();else render()}
const originalEnd=end;end=function(){originalEnd();beep(true);persist()};
const originalTie=tieScreen;tieScreen=function(){originalTie();persist()};
const originalTick=tick;tick=function(){originalTick();persist()};
window.addEventListener('pagehide',persist);
$('#sound').textContent='Sonido: sí';
home();

// Synthesized suspense: all audio works offline; a single master gain silences it instantly.
let suspenseContext=null,suspenseGain=null,suspenseLoop=null,suspenseStep=0;
function stopSuspense(){if(suspenseLoop!==null){clearInterval(suspenseLoop);suspenseLoop=null}if(suspenseGain&&suspenseContext){try{suspenseGain.gain.cancelScheduledValues(suspenseContext.currentTime);suspenseGain.gain.setValueAtTime(0,suspenseContext.currentTime);suspenseGain.disconnect()}catch{}}suspenseGain=null}
function startSuspense(){stopSuspense();if(!sound||state?.phase!=='answer')return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;suspenseContext??=new AC();const ctx=suspenseContext;ctx.resume().catch(()=>{});suspenseGain=ctx.createGain();suspenseGain.gain.value=.24;suspenseGain.connect(ctx.destination);suspenseStep=0;let nextBeat=ctx.currentTime;const pulse=()=>{if(!sound||state?.phase!=='answer'){stopSuspense();return}if(ctx.currentTime<nextBeat)return;const left=Math.max(0,state.deadline-Date.now())/1000;const urgent=left<=10;nextBeat=ctx.currentTime+(urgent?.25:.5);const at=ctx.currentTime;const notes=[220,261.63,220,246.94,220,293.66,246.94,207.65];const osc=ctx.createOscillator(),env=ctx.createGain();osc.type='triangle';osc.frequency.value=notes[suspenseStep%notes.length]*(urgent?2:1);env.gain.setValueAtTime(0,at);env.gain.linearRampToValueAtTime(.6,at+.015);env.gain.exponentialRampToValueAtTime(.001,at+.21);osc.connect(env);env.connect(suspenseGain);osc.start(at);osc.stop(at+.23);osc.onended=()=>{osc.disconnect();env.disconnect()};suspenseStep++};pulse();suspenseLoop=setInterval(pulse,50)}catch{stopSuspense()}}
const tickWithSuspense=tick;tick=function(){tickWithSuspense();startSuspense()};
const pauseWithSuspense=pause;pause=function(){pauseWithSuspense();if(state?.phase!=='answer')stopSuspense()};
const finishWithSuspense=finish;finish=function(){stopSuspense();finishWithSuspense()};
const homeWithSuspense=home;home=function(){stopSuspense();homeWithSuspense()};
const endWithSuspense=end;end=function(){stopSuspense();endWithSuspense()};
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='Sonido: '+(sound?'sí':'no');if(sound&&state?.phase==='answer')startSuspense();else stopSuspense();persist()};
window.addEventListener('pagehide',stopSuspense);

const testAudioButton=document.createElement('button');testAudioButton.id='test-audio';testAudioButton.textContent='♫ Probar sonido';document.querySelector('nav').prepend(testAudioButton);
testAudioButton.onclick=async()=>{try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Sin soporte de audio');suspenseContext??=new AC();await suspenseContext.resume();sound=true;$('#sound').textContent='Sonido: sí';if(state?.phase==='answer')startSuspense();else{[220,261.63,246.94,293.66].forEach((hz,i)=>{const at=suspenseContext.currentTime+i*.3,o=suspenseContext.createOscillator(),g=suspenseContext.createGain();o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(.16,at);g.gain.exponentialRampToValueAtTime(.001,at+.28);o.connect(g);g.connect(suspenseContext.destination);o.start(at);o.stop(at+.3);o.onended=()=>{o.disconnect();g.disconnect()}})}testAudioButton.textContent='♫ Sonido activado';persist()}catch{testAudioButton.textContent='No se pudo activar el audio'}};
</script></body></html>
